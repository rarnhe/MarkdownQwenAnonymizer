name: Markdown Qwen anonymizer dual-track validation
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'test/**']
    paths-ignore: [test_report.md]
  pull_request:
    paths-ignore: [test_report.md]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markdown-qwen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Init report and logs
        if: always()
        run: |
          mkdir -p tests/output
          printf '# Markdown Qwen CI report\n\nRun: %s\nSHA: %s\n' "${{ github.run_id }}" "${{ github.sha }}" > test_report.md
      - name: Install npm dependencies
        id: npm
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee tests/output/npm-ci.log
      - name: Typecheck
        id: typecheck
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee tests/output/typecheck.log
      - name: Unit tests
        id: unit
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run test:unit 2>&1 | tee tests/output/unit.log
      - name: Build standalone JXA osascript and Automator files
        id: build
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee tests/output/build.log
      - name: Execute real osascript for file and directory with local HTTP fixture
        id: jxa
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run test:jxa 2>&1 | tee tests/output/jxa.log
      - name: Setup Python
        uses: actions/setup-python@v6
        if: always()
        with:
          python-version: '3.12'
      - name: Download real Qwen GGUF into tests
        id: model
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install "huggingface_hub>=1,<2" 2>&1 | tee tests/output/pip.log
          python tests/huggleface_downloader.py 2>&1 | tee tests/output/download.log
          test -s tests/qwen2.5-0.5b-instruct-q4_0.gguf
      - name: Launch real llama-server
        id: server
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          brew install llama.cpp 2>&1 | tee tests/output/llama-install.log
          llama-server -m tests/qwen2.5-0.5b-instruct-q4_0.gguf -ngl 0 -c 2048 -b 512 -ub 128 -t 4 --host 127.0.0.1 --port 9931 > tests/output/llama-server.log 2>&1 &
          echo $! > tests/output/llama.pid
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:9931/health > /dev/null 2>&1; then
              echo "llama-server READY" | tee tests/output/server-ready.log
              exit 0
            fi
            if ! kill -0 "$(cat tests/output/llama.pid)" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 60 tests/output/llama-server.log | tee tests/output/server-ready.log
          exit 1
      - name: Real GGUF integration
        id: live
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run test:live 2>&1 | tee tests/output/live.log
      - name: Diagnose real GGUF failure from local synthetic fixture
        if: ${{ always() && steps.live.outcome == 'failure' }}
        run: |
          echo "Last llama-server log lines (synthetic fixture only):"
          tail -n 80 tests/output/llama-server.log || true
          echo "Last integration log lines:"
          tail -n 80 tests/output/live.log || true
      - name: Always write test_report.md
        if: always()
        env:
          STAGE_NPM: ${{ steps.npm.outcome }}
          STAGE_TYPECHECK: ${{ steps.typecheck.outcome }}
          STAGE_UNIT: ${{ steps.unit.outcome }}
          STAGE_BUILD: ${{ steps.build.outcome }}
          STAGE_JXA: ${{ steps.jxa.outcome }}
          STAGE_MODEL: ${{ steps.model.outcome }}
          STAGE_SERVER: ${{ steps.server.outcome }}
          STAGE_LIVE: ${{ steps.live.outcome }}
        run: |
          node tests/summarize-ci.cjs
          cat test_report.md
      - name: Upload report and logs, excluding GGUF and plaintext mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdown-qwen-validation
          path: |
            test_report.md
            tests/output/*.log
          if-no-files-found: warn
      - name: Commit report to feature branch without recursive CI
        if: ${{ github.event_name == 'push' }}
        env:
          REPORT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -- test_report.md
          if git diff --cached --quiet; then
            echo "Report unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: update test_report.md [skip ci]"
          git push origin "HEAD:refs/heads/$REPORT_BRANCH"
      - name: Fail job when any required phase failed
        if: always()
        run: |
          test "${{ steps.npm.outcome }}" = success
          test "${{ steps.typecheck.outcome }}" = success
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.jxa.outcome }}" = success
          test "${{ steps.model.outcome }}" = success
          test "${{ steps.server.outcome }}" = success
          test "${{ steps.live.outcome }}" = success
